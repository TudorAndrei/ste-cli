name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra nlp

      - name: Install the English model
        run: uv run --locked --extra nlp python -m spacy download en_core_web_sm

      - name: Check
        run: |
          uv run --locked --extra nlp ruff format --check .
          uv run --locked --extra nlp ruff check .
          uv run --locked --extra nlp ty check
          uv run --locked --extra nlp pytest
          uv run --locked --extra nlp ste eval --fail-under 1.0 testdata
          uv run --locked --extra nlp ste lint README.md AGENTS.md docs/ skill/
          uv build
