name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14"
          enable-cache: true

      # CI has no spaCy. The eval skips the fixtures that need the analyzer,
      # and the pre-push hook runs them (mise run pre-push).
      - name: Install dependencies
        run: uv sync --locked

      - name: Check
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check
          uv run --locked vulture
          uv run --locked pytest
          uv run --locked ste eval --fail-under 1.0 testdata
          uv run --locked ste lint README.md AGENTS.md docs/ skill/
          uv build
