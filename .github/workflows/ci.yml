name: ci

# Each push and each pull request runs the same checks as a release: the
# format, Ruff and ty, the tests, the labeled corpus, and the lint of
# the documentation with the tool itself.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "${{ matrix.python }}"
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python }}"

      - name: Install Python packages
        run: uv sync --locked --python "${{ matrix.python }}"

      - name: Check format
        run: uv run --locked ruff format --check .

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked ty check

      - name: Run tests
        run: uv run --locked pytest

      - name: Evaluate rules
        run: uv run --locked ste eval --fail-under 1.0 testdata

      - name: Check documentation
        run: uv run --locked ste lint README.md AGENTS.md docs/ skill/

  nlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13
      - name: Install NLP packages and the English model
        run: |
          uv sync --locked --extra nlp
          uv run --extra nlp python -m spacy download en_core_web_sm
      - name: Check the NLP analyzer
        run: uv run --extra nlp pytest tests/test_analyzer.py tests/test_cli.py
