name: release

# A tag that starts with "v" makes a GitHub release with the binaries for
# all platforms. mise installs the tool from those release assets.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Test
        run: mise run ci

      - name: Build the release archives
        run: ./scripts/dist.sh "${GITHUB_REF_NAME}"

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
