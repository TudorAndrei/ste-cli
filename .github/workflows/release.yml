name: release

# A version tag makes a GitHub release with a Python wheel and source archive.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install Python packages
        run: uv sync --locked

      - name: Check format
        run: uv run --locked ruff format --check .

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked ty check

      - name: Run tests
        run: uv run --locked pytest

      - name: Evaluate rules
        run: uv run --locked ste eval --fail-under 1.0 testdata

      - name: Check documentation
        run: uv run --locked ste lint README.md AGENTS.md docs/ skill/

      - name: Build the release files
        run: ./scripts/dist.sh "${GITHUB_REF_NAME}"

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
