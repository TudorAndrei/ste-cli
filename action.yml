name: ste
description: Find ASD-STE100 (Simplified Technical English) violations in Markdown and plain text.
author: TudorAndrei
branding:
  icon: check-square
  color: blue

inputs:
  version:
    description: The version of ste to install, "latest" or one version of a release.
    default: latest
  args:
    description: The flags and the paths of "ste lint".
    default: --fail-on-new .
  format:
    description: The output format. "github" shows each finding on the line of the pull request.
    default: github

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install ste
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        tag=()
        if [ "$STE_VERSION" != latest ]; then tag=("v${STE_VERSION#v}"); fi
        dir="$(mktemp -d "$RUNNER_TEMP/ste-wheel.XXXXXX")"
        gh release download ${tag[@]+"${tag[@]}"} --repo TudorAndrei/ste-cli \
          --pattern 'ste_cli-*-py3-none-any.whl' --pattern checksums.txt --dir "$dir" --clobber
        python - "$dir" <<'PY'
        import hashlib
        import subprocess
        import sys
        from pathlib import Path
        directory = Path(sys.argv[1])
        checksums = {}
        for line in (directory / "checksums.txt").read_text().splitlines():
            digest, name = line.split(maxsplit=1)
            checksums[name] = digest
        wheels = list(directory.glob("*.whl"))
        if len(wheels) != 1:
            raise SystemExit("The release must have one wheel")
        wheel = wheels[0]
        if hashlib.sha256(wheel.read_bytes()).hexdigest() != checksums.get(wheel.name):
            raise SystemExit("The wheel checksum does not agree with checksums.txt")
        environment = directory / "venv"
        subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
        scripts = environment / ("Scripts" if sys.platform == "win32" else "bin")
        python = scripts / ("python.exe" if sys.platform == "win32" else "python")
        subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
        import os
        with open(os.environ["GITHUB_PATH"], "a") as stream:
            stream.write(str(scripts) + "\n")
        PY

    - name: Run ste
      shell: bash
      env:
        STE_ARGS: ${{ inputs.args }}
        STE_FORMAT: ${{ inputs.format }}
      run: |
        # The arguments are words, thus the shell divides them.
        # shellcheck disable=SC2086
        ste lint --format "$STE_FORMAT" $STE_ARGS
