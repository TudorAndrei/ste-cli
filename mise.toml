[tools]
uv = "0.13.8"

[tasks.sync]
description = "Install the Python development tools"
run = "uv sync --locked"

[tasks.fmt]
description = "Format the Python source"
run = "uv run ruff format ."

[tasks.test]
description = "Run all tests"
run = "uv run pytest"

[tasks.lint]
description = "Check the Python source"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Check Python types"
run = "uv run ty check"

[tasks.dead-code]
description = "Find unused Python code"
run = "uv run vulture"

[tasks.fmt-check]
description = "Fail if a file needs formatting"
run = "uv run ruff format --check ."

[tasks.eval]
description = "Measure the rules against the labeled corpus"
run = "uv run ste eval --fail-under 1.0 testdata"

[tasks.lint-docs]
description = "Check the documentation with the tool itself"
run = "uv run ste lint README.md AGENTS.md docs/ skill/"

[tasks.check]
description = "Check the format, source, types, and tests"
depends = ["fmt-check", "lint", "typecheck", "dead-code", "test"]

[tasks.ci]
description = "Run all checks without a change to a source file"
depends = [
  "fmt-check",
  "lint",
  "typecheck",
  "dead-code",
  "test",
  "eval",
  "lint-docs",
]

[tasks.build]
description = "Build the Python wheel and source archive"
run = "uv build"

[tasks.dist]
description = "Build the release files and checksums"
run = "./scripts/dist.sh"

[tasks.nlp]
description = "Install spaCy and its English model for the analyzer"
run = [
  "uv sync --locked --extra nlp",
  "uv pip install 'en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'",
]

[tasks.pre-push]
description = "Run the tests and the corpus with the analyzer. CI has no spaCy."
run = [
  "uv run --locked --extra nlp pytest",
  "uv run --locked --extra nlp ste eval --analyze --fail-under 1.0 testdata",
]

[tasks.hooks]
description = "Install the git pre-push hook"
run = "mise generate git-pre-commit --write --hook pre-push --task pre-push"
